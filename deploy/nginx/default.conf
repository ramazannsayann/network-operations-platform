# Serves the built frontend and reverse-proxies /api and /ws to the FastAPI service.
# Included inside nginx's http {} block (conf.d), so http-level directives like map work here.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve "api" through Docker's DNS at request time, so recreating the api container
    # (new IP) does not leave nginx proxying to a stale address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Live dashboards keep sockets open; don't drop them after nginx's 60 s default.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Vite emits content-hashed file names under /assets, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing: unknown paths fall back to the single-page app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
