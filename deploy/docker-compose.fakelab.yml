# GENERATED by `make fakelab-compose` (python -m netops_fakes.compose) from
# lab/fakelab/topology.yaml. Do not edit by hand.
#
# The fake lab: one container per fake device (and per extra management address) on the
# fakelab network, used together with docker-compose.yml:
#   make fakelab-up        start the stack and the fake devices
#   make fakelab-seed      create the fake lab's credential profiles
#   make fakelab-discover  discover the fake lab from core1
#   make fakelab-down      stop everything
# The worker joins the fakelab network, so discovery reaches the devices at their
# management addresses. Nothing here is reachable from outside the host.

x-fake-device: &fake-device
  build:
    context: ../backend
    target: fakelab
  image: netops-fakelab:dev
  restart: unless-stopped
  profiles: [fakelab]
  environment:
    FAKELAB_USERNAME: ${FAKELAB_USERNAME:-netops-ro}
    FAKELAB_PASSWORD: ${FAKELAB_PASSWORD:?run make fakelab-up, which adds it to deploy/.env}
  volumes:
    - ../lab/fakelab/topology.yaml:/lab/topology.yaml:ro
  # Port 22 without root inside the container.
  sysctls:
    net.ipv4.ip_unprivileged_port_start: "0"

services:
  fake-rtr1:
    <<: *fake-device
    command:
    - /lab/topology.yaml
    - rtr1
    networks:
      fakelab:
        ipv4_address: 10.255.0.129
  fake-core1:
    <<: *fake-device
    command:
    - /lab/topology.yaml
    - core1
    networks:
      fakelab:
        ipv4_address: 10.255.0.2
  fake-core2:
    <<: *fake-device
    command:
    - /lab/topology.yaml
    - core2
    networks:
      fakelab:
        ipv4_address: 10.255.0.3
  fake-dist1:
    <<: *fake-device
    command:
    - /lab/topology.yaml
    - dist1
    networks:
      fakelab:
        ipv4_address: 10.255.0.11
  fake-dist2:
    <<: *fake-device
    command:
    - /lab/topology.yaml
    - dist2
    networks:
      fakelab:
        ipv4_address: 10.255.0.12
  fake-dist2-2:
    <<: *fake-device
    command:
    - /lab/topology.yaml
    - dist2
    networks:
      fakelab:
        ipv4_address: 10.255.0.70
  fake-access1:
    <<: *fake-device
    command:
    - /lab/topology.yaml
    - access1
    networks:
      fakelab:
        ipv4_address: 10.255.0.21
  fake-access2:
    <<: *fake-device
    command:
    - /lab/topology.yaml
    - access2
    networks:
      fakelab:
        ipv4_address: 10.255.0.22
  fake-access3:
    <<: *fake-device
    command:
    - /lab/topology.yaml
    - access3
    networks:
      fakelab:
        ipv4_address: 10.255.0.73
  fake-access4:
    <<: *fake-device
    command:
    - /lab/topology.yaml
    - access4
    networks:
      fakelab:
        ipv4_address: 10.255.0.74
  worker:
    networks:
      default: {}
      fakelab: {}
networks:
  fakelab:
    ipam:
      config:
      - subnet: 10.255.0.0/24
        ip_range: 10.255.0.208/28
        gateway: 10.255.0.254
