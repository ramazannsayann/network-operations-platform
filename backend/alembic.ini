# Alembic configuration. The database URL is NOT set here: migrations/env.py builds it
# from the same environment variables the application uses (POSTGRES_*).

[alembic]
# Migrations ship inside the netops package so they are available in the Docker image.
script_location = netops.db:migrations
# Revision files sort by creation date: 20261009_1a2b3c4d5e6f_enable_timescaledb.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
