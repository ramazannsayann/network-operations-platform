[project]
name = "netops"
version = "0.1.0"
description = "Network management, monitoring and fault-diagnosis platform for Cisco IOS/IOS-XE campus networks."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "celery[redis]>=5.6.3",
    "fastapi>=0.143.0",
    "pydantic-settings>=2.15.0",
    "redis>=6.4.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-socket>=0.8.1",
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "S",     # flake8-bandit (security)
    "BLE",   # blind except
    "C4",    # comprehensions
    "DTZ",   # timezone-aware datetimes
    "T20",   # no print()
    "PT",    # pytest style
    "SIM",   # simplify
    "ASYNC", # async pitfalls
    "RUF",   # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert is how pytest works
# Migrations are generated; long SQL strings in constraints are clearer unwrapped.
"src/netops/db/migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src/netops"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# --disable-socket enforces the hard rule that tests never reach the network
# (databases, Redis or real network devices). Unix sockets stay allowed because
# the asyncio event loop needs them internally.
addopts = "-ra --strict-markers --strict-config --disable-socket --allow-unix-socket"
