name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.24" # same uv as backend/Dockerfile; bump both together
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Type-check (mypy strict)
        run: uv run mypy
      - name: OpenAPI document is up to date
        run: uv run python -m netops.api.export_openapi --check ../docs/api/openapi.json
      - name: Test
        run: uv run pytest

  backend-integration:
    name: Backend integration (TimescaleDB)
    runs-on: ubuntu-24.04
    services:
      db:
        # Keep in sync with deploy/docker-compose.yml (checked by the first step).
        image: timescale/timescaledb:2.30.2-pg16
        env:
          POSTGRES_USER: netops
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: netops
          # Same as docker-compose: never send telemetry out.
          TIMESCALEDB_TELEMETRY: "off"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U netops -d netops"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_POSTGRES_HOST: 127.0.0.1
      TEST_POSTGRES_PORT: "5432"
      TEST_POSTGRES_USER: netops
      TEST_POSTGRES_PASSWORD: ci-only-throwaway
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the service image matches docker-compose
        run: |
          grep -q 'image: timescale/timescaledb:2.30.2-pg16' ../deploy/docker-compose.yml
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.24" # same uv as backend/Dockerfile; bump both together
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Integration tests
        run: uv run pytest -m "integration and not scale"
      - name: Discovery scale test (50 generated devices, prints the duration)
        run: uv run pytest -m scale
        env:
          SCALE_DEVICES: "50"

  frontend:
    name: Frontend (eslint, prettier, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Generated API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts || {
            echo "::error::frontend/src/api/schema.d.ts is stale: run 'make openapi' and commit it"
            exit 1
          }
      - name: Type-check and build
        run: npm run build

  docker:
    name: Docker Compose build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Create deploy/.env from the example
        run: cp deploy/.env.example deploy/.env
      - name: Validate compose file
        run: docker compose -f deploy/docker-compose.yml config --quiet
      - name: Build images
        run: docker compose -f deploy/docker-compose.yml build
