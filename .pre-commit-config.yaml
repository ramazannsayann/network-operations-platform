# Git hooks run on every commit. `make install` installs them; to run them on all files:
#   uv run --project backend pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: ^frontend/tsconfig.*\.json$ # JSON with comments
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key

  # Blocks commits that contain credentials (API keys, passwords, tokens).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10 # keep in step with ruff in backend/uv.lock
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # These use the project's own environments, so versions match CI exactly.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, backend)
        entry: uv run --directory backend mypy
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
      - id: eslint
        name: eslint (frontend)
        entry: npm --prefix frontend run lint
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(ts|tsx|js)$
      - id: prettier
        name: prettier (frontend)
        entry: npm --prefix frontend run format:check
        language: system
        pass_filenames: false
        files: ^frontend/
